spring:
  application:
    name: AIEmailProcessingPlatform

  # --- Import filter chain definitions ---
  # Classpath copy is the fallback; external Docker-mounted copy overrides it.
  # Both are optional — the app starts with an empty filter chain if neither exists.
  config:
    import:
      - optional:classpath:filters.yml
      - optional:file:/app/config/filters.yml

  # --- Spring AI / Ollama configuration ---
  ai:
    ollama:
      base-url: ${OLLAMA_URL:http://192.168.10.180:11434}
      chat:
        options:
          model: qwen3.5:9b-nothink
          temperature: 0.7
          think: false

# ---------------------------------------------------------------------------
# Email Filter Configuration
# ---------------------------------------------------------------------------
emailfilter:

  # --- IMAP accounts to monitor ---
  # Each account runs its own IMAP IDLE connection.
  # Passwords come from environment variables — never hardcode secrets.
  accounts:
    - name: personal
      host: imap.example.com
      username: user@example.com
      password: ${IMAP_PASSWORD_PERSONAL}
      folders:
        inbox: INBOX
        review: LLM-Spam-Review
        junk: Junk
      filters:
        - spam-filter
        - flyer-filter

  # --- SpamAssassin daemon (Layer 2 — header/Bayesian analysis) ---
  spamassassin:
    host: ${SA_HOST:192.168.10.180}
    port: ${SA_PORT:783}
    # Connection and read timeout in milliseconds
    timeout: 5000

  # --- Spam filter (gate — always runs first) ---
  spam-filter:
    enabled: true
    # Model used for Layer 3 semantic analysis
    ollama-model: mistral
    # If SpamAssassin score exceeds this, skip the LLM call entirely
    skip-llm-above-score: 8.0
    # Paths to pre-processor data files (mounted as Docker volumes in production)
    brands-path: classpath:brands.json
    char-substitutions-path: classpath:char_substitutions.json
    whitelist-path: classpath:whitelist.yml
    # Scoring layer weights (must sum to 1.0)
    weights:
      preprocessor: 0.20
      spamassassin: 0.35
      llm: 0.45
    # Score thresholds: 1–safeMax = safe, safeMax+1–reviewMax = review, reviewMax+1–10 = spam
    thresholds:
      safe-max: 3
      review-max: 6
    # IMAP actions per spam tier
    actions:
      safe: none
      review: move-to-review
      spam: move-to-junk
    # Whitelist — whitelisted senders skip the spam filter entirely
    whitelist:
      addresses:
        - ceo@mycompany.com
      domains:
        - mycompany.com
        - trusted-partner.com
      patterns:
        - "*@*.gov.ca"

  # --- Filter engine ---
  # Filter chain definitions are loaded from filters.yml via spring.config.import.
  # Do not define emailfilter.filter-engine.filters here — it lives in filters.yml.

  # --- IMAP connection settings ---
  # Applies to all IMAP IDLE connections. Timeouts in milliseconds.
  imap:
    port: 993
    socket-timeout: 30000
    connection-timeout: 15000
    # Re-issue IDLE before the 29-minute RFC 2177 timeout (28 min = 1680000 ms)
    idle-interval: 1680000
    # Exponential backoff on connection failure
    initial-backoff: 1000
    max-backoff: 300000
    # Time to wait for IDLE threads during graceful shutdown
    shutdown-timeout: 5000

  # --- Processing queue ---
  # Consumer threads pull from a shared queue and dispatch through the filter chain.
  processing:
    consumer-threads: 1
    # Time to wait for consumer threads during graceful shutdown (ms)
    shutdown-timeout-ms: 5000

  # --- Scan (on-demand, always dry-run) ---
  # Scans existing messages in IMAP folders via POST /api/scan.
  scan:
    enabled: true
    inbox-only: true
    limit: 0
    dry-run-limit: 50

  # --- Dry-run mode (Phase 0) ---
  # Runs the full pipeline but records decisions instead of executing actions.
  # Perfect for tuning weights and thresholds before going live.
  dry-run:
    enabled: true
    # Email address to send the digest report to
    report-send-to: admin@example.com
    # File path to save the report (optional, null to skip)
    report-save-to: /var/log/email-filter/dry-run-report.txt
    # Cron expression for scheduled report generation (default: daily at 7am)
    schedule: "0 7 * * *"

  # --- Management / reload API ---
  # Runs on a separate port, internal network only.
  # POST /api/reload/filters, /api/reload/brands, /api/reload/all
  reload:
    port: 8081
    api-key: ${RELOAD_API_KEY}

# ---------------------------------------------------------------------------
# Actuator — restrict exposed endpoints
# ---------------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    env:
      enabled: false
