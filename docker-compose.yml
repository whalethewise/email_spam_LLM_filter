# ---------------------------------------------------------------------------
# AI Email Processing Platform — Docker Compose
# ---------------------------------------------------------------------------
# Ollama is NOT managed here. It must already be running on your network.
# Point spring.ai.ollama.base-url in application.yml to its address.
# The system degrades gracefully if Ollama is unavailable — SpamAssassin and
# pre-processor layers continue scoring; LLM weight is redistributed.
# ---------------------------------------------------------------------------

services:

  email-processor:
    build:
      context: .
      # Multi-stage build from source (cloned repo on server):
      dockerfile: Dockerfile
      # Runtime-only image (pre-built JAR from ./gradlew bootJar):
      # dockerfile: Dockerfile.runtime
    container_name: email-processor
    restart: unless-stopped
    depends_on:
      spamassassin:
        condition: service_started
    env_file:
      - .env
    environment:
      DRY_RUN_REPORT_DIR: /var/log/email-filter
    ports:
      # Main application port
      - "8090:8080"
      # Management / reload API (restrict to internal network in production)
      - "8091:8081"
    volumes:
      # External configuration — edit these without rebuilding the image.
      # Paths inside the container match what application.yml expects.
      - ./config/application.yml:/app/config/application.yml:ro
      - ./config/filters.yml:/app/config/filters.yml:ro
      - ./config/brands.json:/app/config/brands.json:ro
      - ./config/char_substitutions.json:/app/config/char_substitutions.json:ro
      - ./config/whitelist.yml:/app/config/whitelist.yml:ro
      - ./config/prompt.txt:/app/config/prompt.txt:ro
      # Dry-run report output directory
      - ./data/reports:/var/log/email-filter
    networks:
      - email-filter

  spamassassin:
    image: instantlinux/spamassassin:latest
    container_name: spamassassin
    restart: unless-stopped
    # Port 783 is exposed only on the internal network — not published to host.
    expose:
      - "783"
    networks:
      - email-filter
      - ai-platform

networks:
  email-filter:
    driver: bridge
  ai-platform:
    external: true

